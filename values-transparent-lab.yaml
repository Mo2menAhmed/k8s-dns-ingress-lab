# Production-shaped Helm values overlay for testing UDP transparent proxying.
#
# Use this as an overlay together with this lab's existing NGINX Plus Ingress
# values, for example:
#
#   helm upgrade nginx-ingress oci://ghcr.io/nginx/charts/nginx-ingress \
#     --version 2.5.1 \
#     --namespace nginx-ingress \
#     -f nginx-plus-dns-values.yaml \
#     -f values-transparent-lab.yaml
#
# This file intentionally does not change:
# - TCP TransportServer configuration
# - listener port 53
# - backend service dns-lab/coredns:53

controller:
  # Required for TransportServer serverSnippets to be accepted by the F5 NGINX
  # Ingress Controller.
  enableSnippets: true

  # Production-shaped minimum for this lab:
  # The NGINX Plus Ingress image normally runs as UID 101. In this lab, that
  # left NET_RAW in the container bounding set but not in the effective set, so
  # NGINX logged:
  #
  #   setsockopt(IP_TRANSPARENT) failed (1: Operation not permitted)
  #
  # Run the controller master process as root for this transparent UDP test so
  # NGINX can apply proxy_bind ... transparent and pass CAP_NET_RAW to worker
  # processes. Drop every default capability and add back only what this DNS
  # listener and NGINX startup path need:
  # - CHOWN: NGINX startup chowns temp directories
  # - SETGID/SETUID: NGINX master can start workers as nginx
  # - NET_BIND_SERVICE: bind TCP/UDP port 53
  # - NET_RAW: use IP_TRANSPARENT for proxy_bind transparent
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
      add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - NET_RAW
